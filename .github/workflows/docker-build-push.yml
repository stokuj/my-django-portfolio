name: Build, Push and Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # The name for the Docker image, built from the repository name
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-build-placeholder-secret
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DOCKER_DB_ENGINE: django.db.backends.postgresql
      DOCKER_DB_NAME: ci_build_db
      DOCKER_DB_USER: ci_build_user
      DOCKER_DB_PASSWORD: ci_build_password
      DOCKER_DB_HOST: db
      DOCKER_DB_PORT: "5432"
    permissions:
      contents: read
      packages: write # Required to push to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create temporary .env for Compose parsing
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-build-placeholder-secret
          DJANGO_DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=http://127.0.0.1
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          DOCKER_DB_ENGINE=django.db.backends.postgresql
          DOCKER_DB_NAME=ci_build_db
          DOCKER_DB_USER=ci_build_user
          DOCKER_DB_PASSWORD=ci_build_password
          DOCKER_DB_HOST=db
          DOCKER_DB_PORT=5432
          PORTFOLIO_SITE_NAME=My Portfolio
          PORTFOLIO_FULL_NAME=CI User
          PORTFOLIO_ROLE_LINE=Role
          PORTFOLIO_SPECIALIZATION_LINE=Specialization
          PORTFOLIO_EMAIL=ci@example.com
          PORTFOLIO_GITHUB_URL=https://github.com/example
          PORTFOLIO_LINKEDIN_URL=https://www.linkedin.com/in/example/
          APP_DOMAIN=localhost
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images with Docker Compose
        run: docker compose build web

      - name: Push images to GitHub Container Registry
        run: docker compose push web

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ~/my_django_portfolio

            git fetch --all
            git checkout main || git checkout master
            git pull origin main || git pull origin master

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            export IMAGE_NAME=ghcr.io/${{ github.repository }}

            docker compose pull
            docker compose up -d --remove-orphans --force-recreate

            docker image prune -f

