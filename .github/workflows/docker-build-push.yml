name: Test Docker Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Only read permission is needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This step creates a temporary .env file using repository secrets and variables.
      # This mimics your local setup and solves the "file not found" error.
      - name: Create .env file from secrets
        run: |
          cat <<EOF > .env
          # This file is generated automatically during the GitHub Actions workflow

          # Django settings
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ vars.DEBUG }}
          ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}

          # Docker Database settings
          DOCKER_DB_ENGINE=${{ vars.DOCKER_DB_ENGINE }}
          DOCKER_DB_NAME=${{ vars.DOCKER_DB_NAME }}
          DOCKER_DB_USER=${{ vars.DOCKER_DB_USER }}
          DOCKER_DB_PASSWORD=${{ secrets.DOCKER_DB_PASSWORD }}
          DOCKER_DB_HOST=${{ vars.DOCKER_DB_HOST }}
          DOCKER_DB_PORT=${{ vars.DOCKER_DB_PORT }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images using docker-compose
        run: docker compose build