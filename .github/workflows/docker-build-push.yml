name: Build, Push and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/django.yml
    # A called workflow cannot request more than the caller grants.
    permissions:
      contents: read

  build-and-push:
    name: Build and Push Image
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create temporary .env for Compose parsing
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-build-placeholder-secret
          DJANGO_DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=http://127.0.0.1
          DOCKER_DB_ENGINE=django.db.backends.postgresql
          DOCKER_DB_NAME=ci_build_db
          DOCKER_DB_USER=ci_build_user
          DOCKER_DB_PASSWORD=ci_build_password
          DOCKER_DB_HOST=db
          DOCKER_DB_PORT=5432
          PORTFOLIO_SITE_NAME=My Portfolio
          PORTFOLIO_FULL_NAME=CI User
          PORTFOLIO_ROLE_LINE=Role
          PORTFOLIO_SPECIALIZATION_LINE=Specialization
          PORTFOLIO_EMAIL=ci@example.com
          PORTFOLIO_GITHUB_URL=https://github.com/example
          PORTFOLIO_LINKEDIN_URL=https://www.linkedin.com/in/example/
          APP_DOMAIN=localhost
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images with Docker Compose
        run: docker compose --env-file .env -f infra/docker-compose.prod.yml build web

      - name: Push images to GitHub Container Registry
        run: docker compose --env-file .env -f infra/docker-compose.prod.yml push web

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: |
            set -e
            cd ~/my_django_portfolio

            git fetch --all
            git checkout main
            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker compose --env-file .env -p my_django_portfolio -f infra/docker-compose.prod.yml pull
            docker compose --env-file .env -p my_django_portfolio -f infra/docker-compose.prod.yml run --rm --no-deps --entrypoint "" web python manage.py check --deploy --fail-level WARNING
            docker compose --env-file .env -p my_django_portfolio -f infra/docker-compose.prod.yml down --remove-orphans
            docker compose --env-file .env -p my_django_portfolio -f infra/docker-compose.prod.yml up -d --force-recreate

            docker builder prune -af
            docker image prune -af
