<footer class="mt-8 rounded-lg bg-base-300 px-4 py-3 text-sm text-base-content">
    <div class="grid grid-cols-1 items-center gap-2 text-center md:grid-cols-3">
        <p class="md:text-left">Educational project</p>
        <p class="font-medium">MIT License</p>
        <p class="md:text-right">
            {% if project.github_url %}
            <a href="{{ project.github_url }}" target="_blank" rel="noopener noreferrer" class="link link-hover">
                Source code on GitHub
            </a>
            {% endif %}
        </p>
    </div>
</footer>
