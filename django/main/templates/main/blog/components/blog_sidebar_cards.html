{% if project.tech_stack %}
<div class="card bg-base-200 shadow border border-base-300">
    <div class="card-body">
        <h2 class="card-title text-base">Tech Stack</h2>
        <div class="flex flex-wrap gap-2">
            {% for item in project.tech_stack %}
            <span class="badge badge-primary">{{ item }}</span>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}

{% if project.tools_libraries %}
<div class="card bg-base-200 shadow border border-base-300">
    <div class="card-body">
        <h2 class="card-title text-base">Tools / Libraries</h2>
        <div class="flex flex-wrap gap-2">
            {% for item in project.tools_libraries %}
            <span class="badge badge-secondary">{{ item }}</span>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
