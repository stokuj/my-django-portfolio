<li class="rounded-box border border-base-300 bg-base-200 p-4">
    <time class="text-xs font-semibold uppercase tracking-wide text-base-content/60">{{ project.date|date:"F Y" }}</time>
    <h3 class="mt-1 text-base font-semibold">{{ project.title }}</h3>
    <p class="mt-2 text-base-content/80">{{ project.short_description }}</p>
    <div class="mt-3 flex flex-wrap gap-1.5">
        {% for tag in project.tags.all %}
        <span class="badge badge-sm badge-outline">{{ tag.name }}</span>
        {% endfor %}
    </div>
    <div class="mt-4 flex flex-wrap gap-2">
        {% if project.blog and project.blog_url %}
        <a href="/blog/{{ project.blog_url }}" class="btn btn-primary btn-xs">Learn More</a>
        {% else %}
        <a href="{% url 'project_detail' project.id %}" class="btn btn-primary btn-xs">Learn More</a>
        {% endif %}
        {% if project.github_url %}
        <a href="{{ project.github_url }}" class="btn btn-outline btn-xs" target="_blank" rel="noopener noreferrer">GitHub</a>
        {% endif %}
    </div>
</li>
