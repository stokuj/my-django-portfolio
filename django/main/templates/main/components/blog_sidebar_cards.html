<div class="card bg-base-100 shadow border border-base-300">
    <div class="card-body">
        <h2 class="card-title text-base">Tech Stack</h2>
        <div class="flex flex-wrap gap-2">
            {% for item in project.tech_stack %}
            <span class="badge badge-outline{% if forloop.first %} badge-primary{% endif %}">{{ item }}</span>
            {% empty %}
            <span class="badge badge-ghost">Not specified</span>
            {% endfor %}
        </div>
    </div>
</div>
<div class="card bg-base-100 shadow border border-base-300">
    <div class="card-body">
        <h2 class="card-title text-base">Tools / Libraries</h2>
        <div class="flex flex-wrap gap-2">
            {% for item in project.tools_libraries %}
            <span class="badge badge-outline">{{ item }}</span>
            {% empty %}
            <span class="badge badge-ghost">Not specified</span>
            {% endfor %}
        </div>
    </div>
</div>
