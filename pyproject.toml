[project]
name = "my-django-portfolio"
version = "0.2.5"
description = "My portfolio website, created using Django/TailwindCSS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asgiref==3.8.1",
    "bleach==6.2.0",
    "celery[redis]==5.4.0",
    "django==5.1.7",
    "django-allauth==65.13.0",
    "django-environ==0.12.0",
    "gunicorn==23.0.0",
    "markdown==3.8.2",
    "packaging==25.0",
    "pillow==11.1.0",
    "psycopg2-binary==2.9.10",
    "requests==2.32.5",
    "sqlparse==0.5.3",
    "tzdata==2025.2",
]

[tool.uv]
# UV-specific configuration
pip = { upgrade = true }

[tool.setuptools]
packages = ["main", "personal_portfolio"]

[tool.setuptools.package-dir]
"" = "django"
