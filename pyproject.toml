[project]
name = "my-django-portfolio"
version = "0.2.5"
description = "My portfolio website, created using Django/TailwindCSS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bleach==6.2.0",
    "celery[redis]==5.4.0",
    "django==5.1.15",
    "django-environ==0.12.0",
    "gunicorn==23.0.0",
    "markdown==3.8.2",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.10",
    "pymdown-extensions==10.16.1",
    "pyjwt>=2.15.0",
    "requests==2.33.0",
    "sqlparse>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.10",
]

[tool.setuptools]
packages = ["main", "config"]

[tool.setuptools.package-dir]
"" = "django"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["django/main/migrations"]
src = ["django"]

[tool.ruff.lint]
select = ["E", "F", "I"]
