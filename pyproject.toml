[project]
name = "my-django-portfolio"
version = "0.2.5"
description = "My portfolio website, created using Django/TailwindCSS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asgiref==3.8.1",
    "bleach==6.2.0",
    "celery[redis]==5.4.0",
    "django==5.1.15",
    "django-environ==0.12.0",
    "gunicorn==23.0.0",
    "markdown==3.8.2",
    "packaging==25.0",
    "pillow==12.1.1",
    "psycopg2-binary==2.9.10",
    "pymdown-extensions==10.16.1",
    "requests==2.32.5",
    "ruff==0.11.10",
    "sqlparse==0.5.4",
    "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.10",
]

[tool.uv]
pip = { upgrade = true }

[tool.setuptools]
packages = ["main", "config"]

[tool.setuptools.package-dir]
"" = "django"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
