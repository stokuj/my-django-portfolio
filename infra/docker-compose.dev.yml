services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCKER_DB_NAME}
      POSTGRES_USER: ${DOCKER_DB_USER}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres18_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: my-django-portfolio:dev
    user: "10001:10001"
    env_file:
      - ../.env
    working_dir: /app/django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_dev_volume:/app/media
    environment:
      - DB_ENGINE=${DOCKER_DB_ENGINE}
      - DB_NAME=${DOCKER_DB_NAME}
      - DB_USER=${DOCKER_DB_USER}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD}
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: my-django-portfolio:dev
    user: "10001:10001"
    restart: unless-stopped
    env_file:
      - ../.env
    working_dir: /app/django
    command: celery -A config worker --loglevel=info
    volumes:
      - media_dev_volume:/app/media
    environment:
      - DB_ENGINE=${DOCKER_DB_ENGINE}
      - DB_NAME=${DOCKER_DB_NAME}
      - DB_USER=${DOCKER_DB_USER}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD}
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    networks:
      - app-network

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: my-django-portfolio:dev
    user: "10001:10001"
    restart: unless-stopped
    env_file:
      - ../.env
    working_dir: /app/django
    command: celery -A config beat --loglevel=info --schedule=/app/django/celerybeat-schedule/celerybeat-schedule.db
    volumes:
      - celerybeat_dev_schedule:/app/django/celerybeat-schedule
    environment:
      - DB_ENGINE=${DOCKER_DB_ENGINE}
      - DB_NAME=${DOCKER_DB_NAME}
      - DB_USER=${DOCKER_DB_USER}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD}
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres18_dev_data:
  media_dev_volume:
  celerybeat_dev_schedule:
