services:
  db:
    image: postgres:18
    restart: always
    # Use variables from the .env file for security
    environment:
      POSTGRES_DB: ${DOCKER_DB_NAME}
      POSTGRES_USER: ${DOCKER_DB_USER}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: ghcr.io/stokuj/my-django-portfolio:${IMAGE_TAG:-latest}
    user: "10001:10001"
    restart: always
    env_file:
      - ../.env
    working_dir: /app/django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 60 --access-logfile -"
    volumes:
      # Mount the shared volume where static files will be collected
      - staticfiles_volume:/app/staticfiles
      # Mount the shared volume for user-uploaded media files
      - media_volume:/app/media
    environment:
      - DB_ENGINE=${DOCKER_DB_ENGINE}
      - DB_NAME=${DOCKER_DB_NAME}
      - DB_USER=${DOCKER_DB_USER}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD}
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      # Mount the same shared volume to serve static files
      - staticfiles_volume:/srv/static
      # Mount the same shared volume to serve media files
      - media_volume:/srv/media
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - APP_WWW_DOMAIN=${APP_WWW_DOMAIN:-www.localhost}
      - CADDY_HTTPS_PORT=${CADDY_HTTPS_PORT:-443}
      - ADMIN_BASIC_USER=${ADMIN_BASIC_USER}
      - ADMIN_BASIC_HASH=${ADMIN_BASIC_HASH}
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Define the named volumes that will be shared between containers
volumes:
  postgres18_data:
  staticfiles_volume: # For static files (CSS, JS)
  media_volume:     # For media files (user uploads)
  caddy_data:
  caddy_config:
